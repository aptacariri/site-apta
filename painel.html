<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Alunos — Apta</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{color-scheme:dark;--panel:#0e2240;--line:rgba(168,216,242,.13);--line2:rgba(168,216,242,.22);--ink:#eaf3fb;--muted:#8fa2b8;--accent:#A8D8F2;--green:#5fd0a0;--amber:#f0c869;--red:#e88b8b;--blue:#5fa8d8;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:radial-gradient(130% 120% at 88% -10%,#123b6b 0%,#0b1f3d 44%,#07132a 100%) fixed;color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent);}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}
  /* Login */
  .login{max-width:400px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 30px;box-shadow:0 30px 70px rgba(0,0,0,.42);}
  .login .logo{display:flex;justify-content:center;margin-bottom:18px;}
  .login .logo img{height:32px;width:auto;filter:brightness(0) invert(1);opacity:.95;}
  .login h1{font-size:21px;font-weight:700;text-align:center;}
  .login p{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.5;text-align:center;}
  label{font-size:11px;letter-spacing:.05em;color:var(--muted);display:block;margin:18px 0 7px;text-transform:uppercase;font-weight:600;}
  input,select{width:100%;background:#0a1c38;border:1px solid var(--line2);border-radius:12px;padding:13px 14px;font-size:14.5px;color:#fff;font-family:inherit;transition:border-color .15s;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  select{cursor:pointer;}
  .btn{background:linear-gradient(180deg,#c3e6f8,#A8D8F2);color:#0A1A32;font-weight:700;font-size:15px;padding:14px;border-radius:13px;border:none;cursor:pointer;font-family:inherit;width:100%;margin-top:24px;box-shadow:0 12px 28px rgba(95,168,216,.3);transition:transform .15s;}
  .btn:hover{transform:translateY(-1px);}
  .btn:disabled{opacity:.6;cursor:default;transform:none;}
  .err{background:rgba(224,140,140,.12);border:1px solid rgba(224,140,140,.4);color:#E8B0B0;font-size:13px;border-radius:11px;padding:11px 13px;margin-top:16px;line-height:1.45;}
  /* Header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:22px;border-bottom:1px solid var(--line);}
  .top .brand{display:flex;align-items:center;gap:16px;}
  .top .brand img{height:30px;width:auto;filter:brightness(0) invert(1);opacity:.95;}
  .top .brand .bar{width:1px;height:34px;background:var(--line2);}
  .top h1{font-size:19px;font-weight:700;line-height:1.1;}
  .top .sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .top .actions{display:flex;gap:9px;}
  .ghost{background:rgba(168,216,242,.1);border:1px solid var(--line2);color:var(--ink);font-size:13px;font-weight:500;padding:10px 16px;border-radius:11px;cursor:pointer;font-family:inherit;transition:background .15s;}
  .ghost:hover{background:rgba(168,216,242,.18);}
  /* Tabs (segmentado) */
  .tabs{display:inline-flex;gap:4px;margin-bottom:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;}
  .tab{background:transparent;border:none;color:var(--muted);font-size:14px;font-weight:600;padding:10px 24px;border-radius:10px;cursor:pointer;font-family:inherit;transition:.15s;}
  .tab.active{background:var(--accent);color:#0A1A32;}
  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:22px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden;}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
  .stat.green::before{background:var(--green);} .stat.amber::before{background:var(--amber);} .stat.blue::before{background:var(--blue);}
  .stat .n{font-size:30px;font-weight:800;color:#fff;line-height:1;letter-spacing:-.5px;}
  .stat .l{font-size:10.5px;color:var(--muted);margin-top:9px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;}
  /* Filtros */
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .search{width:100%;}
  .filters .search{flex:1;min-width:220px;margin-bottom:0;}
  .filters select{width:auto;min-width:210px;}
  input.mini{padding:9px 12px;font-size:13.5px;border-radius:10px;width:auto;}
  /* Tabela */
  .tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 42px rgba(0,0,0,.24);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:920px;}
  th,td{text-align:left;padding:14px 16px;border-bottom:1px solid rgba(168,216,242,.07);white-space:nowrap;vertical-align:middle;}
  thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;background:rgba(255,255,255,.015);}
  tbody tr{transition:background .12s;}
  tbody tr:hover{background:rgba(168,216,242,.045);}
  tr:last-child td{border-bottom:none;}
  td.name{font-weight:600;color:#fff;white-space:normal;}
  select.mini{padding:7px 12px;font-size:12px;border-radius:20px;width:auto;min-width:112px;font-weight:600;border-width:1.4px;}
  select.mini option{color:#eaf3fb;background:#0e2240;font-weight:500;}
  .link{color:var(--accent);cursor:pointer;font-size:12.5px;background:none;border:none;font-family:inherit;padding:0;font-weight:500;}
  .link:hover{text-decoration:underline;}
  .muted{color:var(--muted);}
  .empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px;}
  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(4,10,20,.74);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50;}
  .modal.open{display:flex;}
  .card{background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:26px;max-width:470px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 40px 90px rgba(0,0,0,.5);}
  .card h2{font-size:20px;font-weight:700;margin-bottom:4px;}
  .row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid rgba(168,216,242,.08);font-size:13.5px;}
  .row .k{color:var(--muted);}.row .v{color:var(--ink);text-align:right;font-weight:500;word-break:break-word;}
  .danger{background:rgba(224,140,140,.13);border:1px solid rgba(224,140,140,.4);color:#E8B0B0;font-size:13px;padding:11px 14px;border-radius:11px;cursor:pointer;font-family:inherit;}
  /* Frequência */
  .chk{appearance:none;width:24px;height:24px;border-radius:7px;border:1.6px solid var(--line2);background:#0a1c38;cursor:pointer;position:relative;transition:.12s;vertical-align:middle;}
  .chk:checked{background:var(--green);border-color:var(--green);}
  .chk:checked::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border:solid #06331f;border-width:0 2.4px 2.4px 0;transform:rotate(45deg);}
  .datebtns{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 8px;}
  .datebtn{background:rgba(168,216,242,.09);border:1px solid var(--line2);color:#B9C6D6;font-size:12px;padding:7px 12px;border-radius:9px;cursor:pointer;font-family:inherit;}
  .datebtn.on{background:var(--accent);color:#0A1A32;border-color:var(--accent);font-weight:600;}
  @media (max-width:560px){
    .wrap{padding:16px 12px 54px;}
    .top{margin-bottom:18px;padding-bottom:16px;}
    .top h1{font-size:17px;}
    .top .brand img{height:26px;}
    .filters .search{min-width:0;}
    .filters select{min-width:0;flex:1;}
    .card{padding:20px;}
    .tabs{display:flex;}
    .tab{padding:10px 15px;font-size:13.5px;flex:1;text-align:center;}
    .stats{grid-template-columns:repeat(2,1fr);}
    th,td{padding:11px 12px;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login" hidden>
  <div class="logo"><img src="/assets/apta-wordmark.svg" alt="Apta"></div>
  <h1>Painel de Gestão</h1>
  <p>Acesso restrito à equipe. Entre com o e-mail e a senha.</p>
  <label>E-mail</label>
  <input id="email" type="email" autocomplete="username" placeholder="aptacariri@gmail.com">
  <label>Senha</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
  <div id="loginErr" class="err" hidden></div>
  <button id="loginBtn" class="btn">Entrar</button>
</div>

<!-- DASHBOARD -->
<div id="appView" class="wrap" hidden>
  <div class="top">
    <div class="brand">
      <img src="/assets/apta-wordmark.svg" alt="Apta">
      <div class="bar"></div>
      <div>
        <h1>Painel de Gestão</h1>
        <div class="sub" id="whoami"></div>
      </div>
    </div>
    <div class="actions">
      <button class="ghost" id="refreshBtn">Atualizar</button>
      <button class="ghost" id="logoutBtn">Sair</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabBtnAlunos">Alunos</button>
    <button class="tab" id="tabBtnFreq">Frequência</button>
  </div>

  <div id="tabAlunos">
    <div class="stats" id="stats"></div>
    <div class="filters">
      <input id="search" class="search" placeholder="Buscar por nome, CPF, cidade, WhatsApp...">
      <select id="cursoFilter"></select>
    </div>
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>Data</th><th>Nome</th><th>Curso</th><th>WhatsApp</th><th>Cidade</th>
            <th>Inscrição</th><th>Pagamento</th><th>Situação</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty" hidden>Nenhuma inscrição ainda. Assim que alguém se inscrever pelo site, aparece aqui.</div>
  </div>

  <div id="tabFreq" hidden>
    <div class="filters">
      <select id="freqCurso"></select>
      <input type="date" id="freqData" class="mini" style="min-width:150px;">
      <button class="ghost" id="addDataBtn">+ Adicionar data</button>
    </div>
    <div class="datebtns" id="freqDatas"></div>
    <div class="sub" id="freqInfo" style="color:#8FA2B8;font-size:13px;margin:8px 0 12px;"></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Nome</th><th>Curso</th><th style="text-align:center;">Presente</th></tr></thead>
        <tbody id="freqRows"></tbody>
      </table>
    </div>
    <div id="freqEmpty" class="empty" hidden>Nenhum aluno neste curso ainda.</div>
  </div>
</div>

<!-- MODAL DETALHES -->
<div class="modal" id="modal">
  <div class="card">
    <h2 id="mNome"></h2>
    <div id="mBody"></div>
    <div style="display:flex;gap:10px;margin-top:18px;">
      <button class="btn" style="flex:1;margin-top:0" id="mContrato">Gerar contrato (A4)</button>
      <button class="ghost" style="flex:1" id="mWhats">Abrir WhatsApp</button>
    </div>
    <div style="display:flex;gap:10px;margin-top:10px;">
      <button class="ghost" style="flex:1" id="mClose">Fechar</button>
      <button class="danger" style="flex:1" id="mDelete">Excluir aluno</button>
    </div>
  </div>
</div>

const $ = (id) => document.getElementById(id);
let alunos = [];
let current = null;

const INSCRICAO = ["Nova", "Confirmada", "Cancelada"];
const PAGAMENTO = ["Pendente", "Pago", "Parcial", "Isento"];
const SITUACAO = ["Cursando", "Aprovado", "Reprovado"];
const CURSOS = ["Cuidador de Pessoa Idosa e Acamada"];
const CURSO_DATAS = ["2026-10-10","2026-10-11","2026-10-17","2026-10-18","2026-10-31","2026-11-01","2026-11-07","2026-11-08"];
let currentTab = "alunos";

function fmtDateBR(d){ const p=(d||"").split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0].slice(2) : (d||""); }
function courseList(){ const s=new Set(CURSOS); alunos.forEach(a=>{ if(a.curso) s.add(a.curso); }); return [...s]; }
function populateCursos(){
  const cs = courseList();
  const fSel = $("cursoFilter").value;
  $("cursoFilter").innerHTML = `<option value="">Todos os cursos</option>` + cs.map(c=>`<option ${c===fSel?"selected":""}>${esc(c)}</option>`).join("");
  const qSel = $("freqCurso").value || cs[0];
  $("freqCurso").innerHTML = cs.map(c=>`<option ${c===qSel?"selected":""}>${esc(c)}</option>`).join("");
}

function fmtData(iso){ if(!iso) return "-"; const d=new Date(iso); return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
function onlyDigits(s){ return (s||"").replace(/\D/g,""); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function checkSession(){
  const { data } = await sb.auth.getSession();
  if (data.session) { showApp(data.session.user.email); }
  else { $("loginView").hidden = false; }
}

async function doLogin(){
  $("loginErr").hidden = true;
  $("loginBtn").disabled = true; $("loginBtn").textContent = "Entrando...";
  const email = $("email").value.trim();
  const password = $("password").value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  $("loginBtn").disabled = false; $("loginBtn").textContent = "Entrar";
  if (error) { $("loginErr").textContent = "E-mail ou senha incorretos."; $("loginErr").hidden = false; return; }
  $("loginView").hidden = true;
  showApp(data.user.email);
}

async function showApp(email){
  $("appView").hidden = false;
  $("whoami").textContent = "Conectado como " + email;
  await load();
}

async function load(){
  const { data, error } = await sb.from("alunos").select("*").order("created_at", { ascending: false });
  if (error) { alert("Erro ao carregar: " + error.message); return; }
  alunos = data || [];
  populateCursos();
  if (!$("freqData").value) $("freqData").value = CURSO_DATAS[0];
  render();
  if (currentTab === "freq") renderFrequencia();
}

function render(){
  const q = onlyDigits($("search").value) ? onlyDigits($("search").value) : $("search").value.toLowerCase().trim();
  const term = $("search").value.toLowerCase().trim();
  const cursoF = $("cursoFilter").value;
  const list = alunos.filter(a => {
    if (cursoF && (a.curso || CURSOS[0]) !== cursoF) return false;
    if (!term) return true;
    const hay = [a.nome,a.cidade,a.whatsapp,a.cpf,a.email,a.bairro].map(x=>(x||"").toLowerCase()).join(" ");
    const hayDigits = onlyDigits(a.cpf) + " " + onlyDigits(a.whatsapp);
    return hay.includes(term) || hayDigits.includes(onlyDigits(term));
  });

  const pagos = alunos.filter(a=>a.status_pagamento==="Pago").length;
  const pend = alunos.filter(a=>a.status_pagamento==="Pendente").length;
  const conf = alunos.filter(a=>a.status_inscricao==="Confirmada").length;
  $("stats").innerHTML =
    stat(alunos.length,"Inscritos") + stat(conf,"Confirmados","blue") + stat(pagos,"Pagos","green") + stat(pend,"Pagamento pendente","amber");

  $("empty").hidden = list.length > 0;
  $("rows").innerHTML = list.map(rowHtml).join("");
}
function stat(n,l,cls){ return `<div class="stat ${cls||''}"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

const STATUS_COLORS = {
  "Nova":"#5fa8d8","Confirmada":"#5fd0a0","Cancelada":"#e88b8b",
  "Pendente":"#f0c869","Pago":"#5fd0a0","Parcial":"#5fa8d8","Isento":"#8fa2b8",
  "Cursando":"#5fa8d8","Aprovado":"#5fd0a0","Reprovado":"#e88b8b",
};

function rowHtml(a){
  const wa = onlyDigits(a.whatsapp);
  const waLink = wa ? `<a href="https://wa.me/55${wa}" target="_blank">${esc(a.whatsapp)}</a>` : "-";
  return `<tr>
    <td class="muted">${fmtData(a.created_at)}</td>
    <td class="name">${esc(a.nome)}</td>
    <td>${sel(a.id,"curso",a.curso||CURSOS[0],CURSOS)}</td>
    <td>${waLink}</td>
    <td>${esc(a.cidade)||"-"}</td>
    <td>${sel(a.id,"status_inscricao",a.status_inscricao||"Nova",INSCRICAO)}</td>
    <td>${sel(a.id,"status_pagamento",a.status_pagamento||"Pendente",PAGAMENTO)}</td>
    <td>${sel(a.id,"situacao",a.situacao||"Cursando",SITUACAO)}</td>
    <td style="white-space:nowrap;">
      <button class="link" onclick="abrirWhatsapp('${a.id}')" title="Abrir WhatsApp">WhatsApp</button>
      <span class="muted"> · </span>
      <button class="link" onclick="gerarContrato('${a.id}')" title="Gerar contrato">Contrato</button>
      <span class="muted"> · </span>
      <button class="link" onclick="openDetails('${a.id}')">Ver</button>
    </td>
  </tr>`;
}
function sel(id,field,val,opts){
  const all = opts.includes(val) ? opts : [val, ...opts];
  const c = STATUS_COLORS[val];
  const st = (field !== "curso" && c) ? `color:${c};border-color:${c}66;background:${c}18;` : "";
  return `<select class="mini" style="${st}" onchange="updateStatus('${id}','${field}',this.value)">` +
    all.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("") + `</select>`;
}

async function updateStatus(id, field, value){
  const { error } = await sb.from("alunos").update({ [field]: value }).eq("id", id);
  if (error) { alert("Erro ao atualizar: " + error.message); return; }
  const a = alunos.find(x=>x.id===id); if (a) a[field]=value;
  render();
}

function openDetails(id){
  const a = alunos.find(x=>x.id===id); if(!a) return;
  current = a;
  $("mNome").textContent = a.nome || "Aluno";
  const rows = [
    ["Curso", a.curso||CURSOS[0]],
    ["WhatsApp", a.whatsapp],["E-mail", a.email],["CPF", a.cpf],["RG", a.rg],
    ["Nascimento", a.nascimento],["Endereço", a.endereco],["Bairro", a.bairro],
    ["Cidade / UF", (a.cidade||"")+" - "+(a.estado||"")],["CEP", a.cep],
    ["Experiência", a.experiencia],["Mensagem", a.mensagem],
    ["Inscrição em", fmtData(a.created_at)],
  ];
  const pres = Object.keys(a.presencas||{}).filter(d=>(a.presencas||{})[d]).sort();
  $("mBody").innerHTML = rows.map(([k,v])=>`<div class="row"><span class="k">${k}</span><span class="v">${esc(v)||"-"}</span></div>`).join("") + `
    <div style="display:flex;gap:12px;margin-top:16px;">
      <div style="flex:1;"><label style="margin-top:0;">Nota</label><input id="mNota" class="mini" style="width:100%;" value="${esc(a.nota||"")}" placeholder="Ex: 8,5"></div>
      <div style="flex:1.3;"><label style="margin-top:0;">Situação</label><select id="mSituacao" style="width:100%;">${SITUACAO.map(s=>`<option ${s===(a.situacao||"Cursando")?"selected":""}>${s}</option>`).join("")}</select></div>
    </div>
    <div style="margin-top:14px;"><label style="margin-top:0;">Presenças (${pres.length})</label>
      <div style="font-size:12.5px;color:#B9C6D6;line-height:1.7;">${pres.length ? pres.map(d=>fmtDateBR(d)).join(" · ") : "Nenhuma presença marcada ainda."}</div>
    </div>`;
  $("mNota").onchange = ()=> updateStatus(a.id,"nota",$("mNota").value);
  $("mSituacao").onchange = ()=> updateStatus(a.id,"situacao",$("mSituacao").value);
  $("mContrato").onclick = ()=> gerarContrato(a.id);
  $("mWhats").onclick = ()=> abrirWhatsapp(a.id);
  $("modal").classList.add("open");
}

function abrirWhatsapp(id){
  const a = alunos.find(x=>x.id===id); if(!a) return;
  const num = onlyDigits(a.whatsapp);
  if(!num){ alert("Este aluno não tem WhatsApp cadastrado."); return; }
  const nome = (a.nome||"").trim().split(/\s+/)[0];
  const msg = encodeURIComponent("Olá " + nome + "! Aqui é da Apta Assessoria e Treinamentos.");
  window.open("https://wa.me/55" + num + "?text=" + msg, "_blank");
}

function gerarContrato(id){
  const a = alunos.find(x=>x.id===id); if(!a) return;
  const w = window.open("", "_blank");
  if(!w){ alert("Ative os pop-ups deste site para gerar o contrato."); return; }
  w.document.open();
  w.document.write(contratoHTML(a));
  w.document.close();
}

async function deleteCurrent(){
  if(!current) return;
  if(!confirm("Excluir "+(current.nome||"este aluno")+" definitivamente?")) return;
  const { error } = await sb.from("alunos").delete().eq("id", current.id);
  if (error) { alert("Erro ao excluir: " + error.message); return; }
  alunos = alunos.filter(x=>x.id!==current.id);
  $("modal").classList.remove("open"); current=null; render();
}

function switchTab(tab){
  currentTab = tab;
  $("tabAlunos").hidden = tab !== "alunos";
  $("tabFreq").hidden = tab !== "freq";
  $("tabBtnAlunos").classList.toggle("active", tab === "alunos");
  $("tabBtnFreq").classList.toggle("active", tab === "freq");
  if (tab === "freq") renderFrequencia();
}

function setFreqData(d){ $("freqData").value = d; renderFrequencia(); }
function getDatas(){ try{ const v=localStorage.getItem("apta_datas_freq"); if(v) return JSON.parse(v); }catch(e){} return CURSO_DATAS.slice(); }
function saveDatas(a){ try{ localStorage.setItem("apta_datas_freq", JSON.stringify(a)); }catch(e){} }
function addData(){
  const d = $("freqData").value;
  if(!d){ alert("Escolha uma data no calendário primeiro."); return; }
  const arr = getDatas();
  if(!arr.includes(d)){ arr.push(d); arr.sort(); saveDatas(arr); }
  renderFrequencia();
}
function removeData(d){
  if(!confirm("Remover a data "+fmtDateBR(d)+" da lista de botões?\n(As presenças já marcadas NÃO são apagadas.)")) return;
  saveDatas(getDatas().filter(x=>x!==d));
  renderFrequencia();
}

function renderFrequencia(){
  const curso = $("freqCurso").value;
  const data = $("freqData").value;
  $("freqDatas").innerHTML = getDatas().map(d=>`<span class="datebtn ${d===data?"on":""}" style="display:inline-flex;align-items:center;gap:7px;"><span onclick="setFreqData('${d}')" style="cursor:pointer;">${fmtDateBR(d)}</span><span onclick="removeData('${d}')" title="Remover data" style="cursor:pointer;font-weight:700;opacity:.55;font-size:14px;line-height:1;">×</span></span>`).join("");
  const list = alunos.filter(a => (a.curso||CURSOS[0]) === curso);
  $("freqEmpty").hidden = list.length > 0;
  if (!data){ $("freqInfo").textContent = "Selecione uma data acima para marcar presença."; $("freqRows").innerHTML = ""; return; }
  let pres = 0;
  $("freqRows").innerHTML = list.map(a=>{
    const on = !!((a.presencas||{})[data]);
    if (on) pres++;
    return `<tr><td class="name">${esc(a.nome)}</td><td class="muted">${esc(a.curso||CURSOS[0])}</td>
      <td style="text-align:center;"><input type="checkbox" class="chk" ${on?"checked":""} onchange="togglePresenca('${a.id}','${data}',this.checked)"></td></tr>`;
  }).join("");
  $("freqInfo").innerHTML = `Data <strong style="color:#EAF3FB;">${fmtDateBR(data)}</strong> · Presentes: <strong style="color:#EAF3FB;">${pres}</strong> de ${list.length}`;
}

async function togglePresenca(id, date, checked){
  const a = alunos.find(x=>x.id===id); if(!a) return;
  const p = Object.assign({}, a.presencas || {});
  if (checked) p[date] = true; else delete p[date];
  const { error } = await sb.from("alunos").update({ presencas: p }).eq("id", id);
  if (error) { alert("Erro ao salvar presença: " + error.message); return; }
  a.presencas = p;
  renderFrequencia();
}

$("modal").onclick = (e)=>{ if(e.target===$("modal")) $("modal").classList.remove("open"); };

checkSession();
